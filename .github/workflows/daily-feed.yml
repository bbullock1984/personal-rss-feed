name: Build daily RSS feed

on:
  schedule:
    - cron: '0 06 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build feed
        run: python scripts/build_feed.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml data/history.json data/digests.json
          git diff --quiet --cached || git commit -m "Daily feed rebuild $(date -u +'%Y-%m-%d')"
          git push
